name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Run all tests
        run: go test ./...
      - name: Build lf for Linux, Mac and Windows
        run: |
          GOOS=linux   GOARCH=amd64 go build -o dist/lf-linux-amd64   ./cmd/lf
          GOOS=darwin  GOARCH=arm64 go build -o dist/lf-mac-arm64     ./cmd/lf
          GOOS=windows GOARCH=amd64 go build -o dist/lf-windows.exe   ./cmd/lf
      - name: Build the website
        run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o site/laserfeet.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/
          python3 site/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: laserfeet-build
          path: |
            dist/
            site/index.html
            site/laserfeet.wasm
