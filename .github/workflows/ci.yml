name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow can only read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to an exact commit, so a moved or hijacked tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # newest supported Go, so builds get the latest security fixes
          go-version: "1.26.x"
          check-latest: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Start PostgreSQL (installed on GitHub's runners) with a password login
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost; do sleep 1; done
          sudo -u postgres psql -qc "create user laser with superuser password 'ci-only-password'"
      - name: Run all tests, including security and PostgreSQL tests, with the race detector
        env:
          LF_TEST_DATABASE: postgres://laser:ci-only-password@127.0.0.1:5432/postgres
          LF_TEST_DATABASE_TLS: postgres://laser:ci-only-password@localhost:5432/postgres
        run: go test -race ./...
      - name: Check memory budgets
        run: go test ./lang -run TestMemoryBudgets -v
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Build everything
        run: ./scripts/build.sh
      - name: Test the VS Code extension against the language server
        run: LF=dist/lf-linux-amd64 node editors/vscode/test/extension.test.js
      - name: Build the Docker image and run a new app in a container
        run: |
          cp /etc/ssl/certs/ca-certificates.crt dist/
          docker build --build-arg TARGETARCH=amd64 -f docker/Dockerfile -t laserfeet:ci dist
          docker run --rm laserfeet:ci version
          work="$(mktemp -d)"
          dist/lf-linux-amd64 new demo >/dev/null && mv demo "$work/"
          docker build --build-arg LF_IMAGE=laserfeet:ci -t demo:ci "$work/demo"
          docker run -d --name demo -p 8080:8080 demo:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/ && break; sleep 0.5; done | tee reply.txt
          grep -q "Hello from demo!" reply.txt
          test "$(docker inspect -f '{{.Config.User}}' demo:ci)" = "65534:65534"
          docker rm -f demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laserfeet-build
          path: dist/
