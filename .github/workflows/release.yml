name: Release

# Publishes a release whenever the VERSION file changes on main.
# To release: change VERSION (for example 0.2.0), commit, and push or merge to main.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the tag and the GitHub release
      id-token: write      # sign the build provenance
      attestations: write  # store the provenance on GitHub
      packages: write      # publish the Docker image to GitHub's container registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the version and make sure it is new
        id: v
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must look like 1.2.3, got '$version'"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.v.outputs.skip != 'true'
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: "22"
      - name: Test before releasing
        if: steps.v.outputs.skip != 'true'
        run: go test -race ./...
      - name: Build binaries, website, editor extension and SHA256SUMS
        if: steps.v.outputs.skip != 'true'
        run: ./scripts/build.sh
      - name: Sign build provenance for every file
        if: steps.v.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Build and publish the Docker image (amd64 and arm64)
        if: steps.v.outputs.skip != 'true'
        id: image
        env:
          TAG: ${{ steps.v.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p image && cp dist/lf-linux-amd64 dist/lf-linux-arm64 image/
          cp /etc/ssl/certs/ca-certificates.crt image/
          docker buildx create --use --name lf
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile \
            -t "$image:${TAG#v}" -t "$image:latest" --metadata-file meta.json --push image
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(python3 -c 'import json;print(json.load(open("meta.json"))["containerimage.digest"])')" >> "$GITHUB_OUTPUT"
      - name: Sign build provenance for the Docker image
        if: steps.v.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish the release
        if: steps.v.outputs.skip != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Laser Feet ${{ steps.v.outputs.tag }}
          files: dist/*
          body: |
            Install with one line (the installer checks the SHA-256 checksum for you):

                curl -fsSL https://billionairedev24.github.io/laserfeet/install.sh | sh        # Mac / Linux
                irm https://billionairedev24.github.io/laserfeet/install.ps1 | iex             # Windows

            Docker image (signed provenance):

                docker run --rm ghcr.io/${{ github.repository }}:latest version

            Or verify a manual download yourself:

                sha256sum --check --ignore-missing SHA256SUMS
                gh attestation verify <file> --repo ${{ github.repository }}

            See SECURITY.md for details.
